<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 46" width="240" height="46" fill="none">
  <style>
    .badge-bg { fill: #C76B50; stroke: rgba(255,255,255,0.25); stroke-width: 1; rx: 23px; transition: all 0.2s ease; }
    .mark-bg { fill: rgba(255,255,255,0.18); rx: 14px; stroke: rgba(255,255,255,0.3); stroke-width: 1; }
    .txt-sub { font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: rgba(255,255,255,0.85); font-weight: 500; letter-spacing: 0.02em; }
    .txt-brand { font-family: -apple-system, BlinkMacSystemFont, "Cabinet Grotesk", "Plus Jakarta Sans", sans-serif; font-size: 12.5px; fill: #FFFFFF; font-weight: 700; letter-spacing: -0.01em; }
    .arrow-icon { stroke: #FFFFFF; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s ease; }
    a:hover .badge-bg { fill: #D97A5E; }
    a:hover .arrow-icon { transform: translate(1.5px, -1.5px); }
  </style>
  <a href="https://nextreachstudio.in/?utm_source=client-badge&amp;utm_medium=svg_badge_terracotta&amp;utm_campaign=attribution" target="_blank" rel="noopener noreferrer">
    <rect x="1" y="1" width="238" height="44" class="badge-bg" />
    
    <!-- Emblem Squircle -->
    <g transform="translate(8, 7)">
      <rect x="0" y="0" width="32" height="32" class="mark-bg" />
      <g transform="translate(6, 4) scale(0.16)" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="29,38 60,8 91,38" />
        <line x1="60" y1="8" x2="60" y2="142" />
        <path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" />
        <path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" />
        <line x1="60" y1="104" x2="110" y2="142" />
      </g>
    </g>

    <!-- Typography -->
    <text x="48" y="21" class="txt-sub">Crafted by</text>
    <text x="48" y="34" class="txt-brand">NextReach Studio</text>

    <!-- External Arrow -->
    <g transform="translate(216, 17)">
      <line x1="0" y1="11" x2="11" y2="0" class="arrow-icon" />
      <polyline points="4,0 11,0 11,7" class="arrow-icon" />
    </g>
  </a>
</svg>
