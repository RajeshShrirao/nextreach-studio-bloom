<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="hlGlowCase" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#C76B50" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#C76B50" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#141416" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="1080" height="1920" fill="#141416" />

  <!-- Center Highlight Circle Container -->
  <circle cx="540" cy="960" r="320" fill="url(#hlGlowCase)" />
  <circle cx="540" cy="960" r="260" fill="#1F1F23" stroke="#C76B50" stroke-width="5" stroke-opacity="0.4" />

  <!-- Highlight Icon: Case Studies (Growth Chart & Arrow) -->
  <g transform="translate(420, 840) scale(2.0)" fill="none" stroke="#C76B50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 90 45 65 70 75 100 35" />
    <polyline points="80 35 100 35 100 55" />
    <line x1="20" y1="100" x2="100" y2="100" />
    <line x1="20" y1="20" x2="20" y2="100" />
  </g>

  <!-- Title Label -->
  <text x="540" y="1320" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="36px" fill="#FAF8F5" letter-spacing="0.1em" text-anchor="middle">CASE STUDIES</text>
  <text x="540" y="1370" font-family="'JetBrains Mono', monospace" font-size="18px" font-weight="700" fill="#6E6862" letter-spacing="0.15em" text-anchor="middle">PROVEN CLIENT ROI</text>
</svg>
