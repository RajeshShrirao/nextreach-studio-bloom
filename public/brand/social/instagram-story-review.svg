<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&amp;family=JetBrains+Mono:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      .rev-stars { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 42px; fill: #C76B50; letter-spacing: 0.1em; }
      .rev-quote { font-family: 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 48px; fill: #FAF8F5; letter-spacing: -0.025em; line-height: 1.3; }
      .rev-author { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 26px; fill: #FAF8F5; }
      .rev-role { font-family: 'JetBrains Mono', monospace; font-size: 16px; fill: #A69D92; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#141416" />

  <!-- Top Bar -->
  <g transform="translate(80, 160)">
    <g transform="translate(0, 0) scale(0.35)" fill="none" stroke="#C76B50" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="29,38 60,8 91,38" /><line x1="60" y1="8" x2="60" y2="142" /><path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" /><path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" /><line x1="60" y1="104" x2="110" y2="142" />
    </g>
    <text x="56" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24px" fill="#FAF8F5">NextReach <tspan fill="#C76B50">Studio</tspan></text>
    <rect x="760" y="4" width="160" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" />
    <text x="840" y="27" font-family="'JetBrains Mono', monospace" font-size="14px" font-weight="700" fill="#10B981" text-anchor="middle">CLIENT REVIEW</text>
  </g>

  <!-- Review Center Container Card -->
  <g transform="translate(80, 360)">
    <rect width="920" height="1060" rx="32" fill="#1F1F23" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

    <!-- Stars -->
    <text x="60" y="100" class="rev-stars">★★★★★</text>

    <!-- Testimonial Quote -->
    <g transform="translate(60, 200)">
      <text x="0" y="0" class="rev-quote">“NextReach shipped our</text>
      <text x="0" y="65" class="rev-quote">entire luxury web flagship</text>
      <text x="0" y="130" class="rev-quote">in 7 days. Our mobile</text>
      <text x="0" y="195" class="rev-quote">conversions tripled within</text>
      <text x="0" y="260" class="rev-quote">the first week.”</text>
    </g>

    <!-- Divider -->
    <line x1="60" y1="620" x2="860" y2="620" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

    <!-- Author Bio & Business -->
    <g transform="translate(60, 680)">
      <rect width="80" height="80" rx="20" fill="#C76B50" />
      <g transform="translate(23, 15) scale(0.35)" fill="none" stroke="#FAF8F5" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="29,38 60,8 91,38" /><line x1="60" y1="8" x2="60" y2="142" /><path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" /><path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" /><line x1="60" y1="104" x2="110" y2="142" />
      </g>

      <text x="110" y="35" class="rev-author">Dr. S. Kulkarni</text>
      <text x="110" y="65" class="rev-role">Founder • Pune Healthcare &amp; Wellness Flagship</text>
    </g>

    <!-- Metrics Chip Box -->
    <g transform="translate(60, 840)">
      <rect width="800" height="140" rx="20" fill="#141416" stroke="rgba(199, 107, 80, 0.25)" />
      <g transform="translate(40, 50)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14px" font-weight="700" fill="#10B981">RESULT: 10× WhatsApp Leads</text>
        <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="16px" fill="#A69D92">Delivered on time with zero retainer surprises.</text>
      </g>
    </g>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(80, 1500)">
    <rect width="920" height="120" rx="24" fill="#C76B50" />
    <text x="460" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24px" fill="#FFFFFF" text-anchor="middle">Book Your 14-Day Sprint &#8594;</text>
  </g>
</svg>
