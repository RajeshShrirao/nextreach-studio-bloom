<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&amp;family=JetBrains+Mono:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      .cat-title { font-family: 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 54px; fill: #FAF8F5; letter-spacing: -0.025em; line-height: 1.15; }
      .cat-acc { fill: #C76B50; }
      .cat-price { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 900; font-size: 58px; fill: #C76B50; }
      .cat-feat { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; fill: #FAF8F5; font-weight: 600; }
      .cat-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 17px; fill: #8C847B; }
      .cat-mono { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; fill: #10B981; letter-spacing: 0.1em; }
    </style>
    <radialGradient id="cat1Glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#C76B50" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#C76B50" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#141416" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#141416" />
  <circle cx="850" cy="250" r="450" fill="url(#cat1Glow)" />
  <rect x="1" y="1" width="1078" height="1078" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Top Logo Bar -->
  <g transform="translate(60, 60)">
    <g transform="translate(0, 0) scale(0.35)" fill="none" stroke="#C76B50" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="29,38 60,8 91,38" /><line x1="60" y1="8" x2="60" y2="142" /><path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" /><path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" /><line x1="60" y1="104" x2="110" y2="142" />
    </g>
    <text x="56" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24px" fill="#FAF8F5">NextReach <tspan fill="#C76B50">Studio</tspan></text>
    <rect x="740" y="4" width="220" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" />
    <text x="850" y="27" class="cat-mono" text-anchor="middle">3-DAY TURNAROUND</text>
  </g>

  <!-- Product Title & Price Block -->
  <g transform="translate(60, 160)">
    <rect width="960" height="180" rx="24" fill="#1F1F23" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
    <text x="40" y="65" class="cat-title">Quick Launch Website</text>
    <text x="40" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="20px" fill="#A69D92">High-converting 1-page digital flagship for Pune businesses.</text>
    
    <g transform="translate(700, 45)">
      <text x="0" y="55" class="cat-price">₹5,000</text>
      <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="13px" fill="#8C847B">ONE-TIME INVESTMENT</text>
    </g>
  </g>

  <!-- Feature Grid -->
  <g transform="translate(60, 370)">
    <rect width="960" height="490" rx="24" fill="#1F1F23" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
    
    <!-- Item 1 -->
    <g transform="translate(40, 50)">
      <circle cx="20" cy="20" r="14" fill="rgba(199, 107, 80, 0.2)" />
      <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16px" fill="#C76B50" text-anchor="middle">✓</text>
      <text x="50" y="22" class="cat-feat">Custom UI/UX Design (No Generic AI Templates)</text>
      <text x="50" y="48" class="cat-sub">Tailored to your specific brand, audience, and offerings.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(40, 150)">
      <circle cx="20" cy="20" r="14" fill="rgba(199, 107, 80, 0.2)" />
      <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16px" fill="#C76B50" text-anchor="middle">✓</text>
      <text x="50" y="22" class="cat-feat">Sub-Second Mobile Load Times (Astro 6 Engine)</text>
      <text x="50" y="48" class="cat-sub">100/100 Core Web Vitals to maximize Google rank and ad conversions.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(40, 250)">
      <circle cx="20" cy="20" r="14" fill="rgba(199, 107, 80, 0.2)" />
      <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16px" fill="#C76B50" text-anchor="middle">✓</text>
      <text x="50" y="22" class="cat-feat">1-Tap Direct WhatsApp Lead Capture</text>
      <text x="50" y="48" class="cat-sub">Pre-filled message triggers sent directly to your phone.</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(40, 350)">
      <circle cx="20" cy="20" r="14" fill="rgba(199, 107, 80, 0.2)" />
      <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16px" fill="#C76B50" text-anchor="middle">✓</text>
      <text x="50" y="22" class="cat-feat">Full Deployment on Vercel + Free SSL Certificate</text>
      <text x="50" y="48" class="cat-sub">Complete ownership. Zero monthly hosting lock-in.</text>
    </g>
  </g>

  <!-- Bottom CTA Bar -->
  <g transform="translate(60, 890)">
    <rect width="960" height="120" rx="24" fill="#C76B50" />
    <text x="50" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26px" fill="#FFFFFF">Reply to this product to book your 3-day sprint &rarr;</text>
  </g>
</svg>
