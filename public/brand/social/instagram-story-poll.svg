<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&amp;family=JetBrains+Mono:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
      .poll-title { font-family: 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 58px; fill: #FAF8F5; letter-spacing: -0.03em; line-height: 1.2; text-anchor: middle; }
      .poll-acc { fill: #C76B50; }
      .poll-opt { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 24px; fill: #1F1F23; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#141416" />
  <rect x="20" y="20" width="1040" height="1880" rx="32" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Top Bar -->
  <g transform="translate(80, 160)">
    <g transform="translate(0, 0) scale(0.35)" fill="none" stroke="#C76B50" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="29,38 60,8 91,38" /><line x1="60" y1="8" x2="60" y2="142" /><path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" /><path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" /><line x1="60" y1="104" x2="110" y2="142" />
    </g>
    <text x="56" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24px" fill="#FAF8F5">NextReach <tspan fill="#C76B50">Studio</tspan></text>
  </g>

  <!-- Poll Question Container -->
  <g transform="translate(80, 360)">
    <text x="460" y="0" class="poll-title">What is slowing down your</text>
    <text x="460" y="70" class="poll-title">business pipeline the most?</text>
  </g>

  <!-- Native Poll Sticker Placement Guides -->
  <g transform="translate(100, 560)">
    <!-- Option A -->
    <rect width="880" height="150" rx="24" fill="#FAF8F5" />
    <text x="50" y="88" class="poll-opt">A) Slow / Outdated Website That Doesn't Convert</text>
    <circle cx="820" cy="75" r="24" fill="#C76B50" />
    <text x="820" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20px" fill="#FFFFFF" text-anchor="middle">A</text>

    <!-- Option B -->
    <g transform="translate(0, 190)">
      <rect width="880" height="150" rx="24" fill="#FAF8F5" />
      <text x="50" y="88" class="poll-opt">B) Manual Follow-Ups &amp; Lost WhatsApp Leads</text>
      <circle cx="820" cy="75" r="24" fill="#C76B50" />
      <text x="820" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20px" fill="#FFFFFF" text-anchor="middle">B</text>
    </g>

    <!-- Option C -->
    <g transform="translate(0, 380)">
      <rect width="880" height="150" rx="24" fill="#FAF8F5" />
      <text x="50" y="88" class="poll-opt">C) High Agency Retainer Costs With No ROI</text>
      <circle cx="820" cy="75" r="24" fill="#C76B50" />
      <text x="820" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20px" fill="#FFFFFF" text-anchor="middle">C</text>
    </g>
  </g>

  <!-- Bottom CTA Card -->
  <g transform="translate(80, 1300)">
    <rect width="920" height="180" rx="28" fill="#1F1F23" stroke="rgba(199, 107, 80, 0.3)" stroke-width="1.5" />
    <text x="50" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26px" fill="#FAF8F5">We Fix All 3 in a 14-Day Fixed Sprint.</text>
    <text x="50" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="18px" fill="#A69D92">Transparent pricing starting at ₹5,000.</text>
    <rect x="680" y="50" width="190" height="80" rx="18" fill="#C76B50" />
    <text x="775" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20px" fill="#FFFFFF" text-anchor="middle">DM Us &#8594;</text>
  </g>
</svg>
