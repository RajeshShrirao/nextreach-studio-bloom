<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&amp;family=JetBrains+Mono:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      .story-title { font-family: 'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 64px; fill: #FAF8F5; letter-spacing: -0.03em; line-height: 1.15; }
      .story-acc { fill: #C76B50; }
      .story-desc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; fill: #A69D92; font-weight: 500; line-height: 1.5; }
      .story-mono { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; fill: #C76B50; letter-spacing: 0.1em; }
    </style>
    <radialGradient id="st1Glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#C76B50" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#C76B50" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#141416" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#141416" />
  <circle cx="540" cy="600" r="500" fill="url(#st1Glow)" />

  <!-- Top Handle Header (Safe Zone Clearance) -->
  <g transform="translate(80, 160)">
    <g transform="translate(0, 0) scale(0.35)" fill="none" stroke="#C76B50" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="29,38 60,8 91,38" /><line x1="60" y1="8" x2="60" y2="142" /><path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" /><path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" /><line x1="60" y1="104" x2="110" y2="142" />
    </g>
    <text x="56" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24px" fill="#FAF8F5">NextReach <tspan fill="#C76B50">Studio</tspan></text>
    <rect x="760" y="4" width="160" height="36" rx="18" fill="rgba(199, 107, 80, 0.15)" stroke="rgba(199, 107, 80, 0.3)" />
    <text x="840" y="27" class="story-mono" text-anchor="middle">NEW LAUNCH</text>
  </g>

  <!-- Main Hero Story Card -->
  <g transform="translate(80, 280)">
    <rect width="920" height="1200" rx="28" fill="#1F1F23" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />

    <!-- Card Badge -->
    <g transform="translate(50, 60)">
      <rect width="220" height="38" rx="19" fill="#C76B50" />
      <text x="110" y="25" font-family="'JetBrains Mono', monospace" font-size="13px" font-weight="700" fill="#FFFFFF" text-anchor="middle">FLAGSHIP RELEASE</text>
    </g>

    <!-- Title Lines -->
    <g transform="translate(50, 180)">
      <text x="0" y="0" class="story-title">We Just Deployed</text>
      <text x="0" y="75" class="story-title">A Sub-Second</text>
      <text x="0" y="150" class="story-title"><tspan class="story-acc">Flagship Platform</tspan>.</text>
      <text x="0" y="235" class="story-desc">Engineered with Astro 6, Tailwind v4,</text>
      <text x="0" y="275" class="story-desc">and automated WhatsApp lead capture.</text>
    </g>

    <!-- Visual Code / Preview Frame -->
    <g transform="translate(50, 520)">
      <rect width="820" height="420" rx="20" fill="#141416" stroke="rgba(199, 107, 80, 0.25)" stroke-width="1.5" />
      <rect width="820" height="50" rx="20" fill="#242428" />
      <circle cx="30" cy="25" r="6" fill="#EF4444" />
      <circle cx="50" cy="25" r="6" fill="#F59E0B" />
      <circle cx="70" cy="25" r="6" fill="#10B981" />
      <text x="100" y="30" font-family="'JetBrains Mono', monospace" font-size="14px" fill="#A69D92">https://www.nextreachstudio.in/demos/</text>
      
      <!-- Metrics Inside Card -->
      <g transform="translate(50, 110)">
        <text x="0" y="40" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="54px" fill="#10B981">100 / 100</text>
        <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20px" fill="#FAF8F5">Core Web Vitals Performance</text>

        <text x="0" y="150" font-family="'Cabinet Grotesk', sans-serif" font-weight="900" font-size="54px" fill="#C76B50">0.32s</text>
        <text x="0" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20px" fill="#FAF8F5">Largest Contentful Paint (LCP)</text>
      </g>
    </g>

    <!-- Link Sticker Placeholder -->
    <g transform="translate(50, 1000)">
      <rect width="820" height="120" rx="20" fill="#FAF8F5" />
      <text x="60" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24px" fill="#1F1F23">🔗 TAP TO VIEW LIVE DEMO &#8594;</text>
      <text x="680" y="70" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16px" fill="#C76B50">DEMO</text>
    </g>
  </g>

  <!-- Bottom Reply Bar Guide -->
  <g transform="translate(80, 1600)">
    <text x="460" y="40" font-family="'JetBrains Mono', monospace" font-size="15px" font-weight="700" fill="#6E6862" text-anchor="middle">DM "SPRINT" TO GET YOUR SITE IN 14 DAYS</text>
  </g>
</svg>
