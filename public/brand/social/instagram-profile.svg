<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="igBgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#C76B50" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#C76B50" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#141416" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="igRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C76B50" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FAF8F5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#C76B50" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Dark Charcoal Base Canvas -->
  <rect width="1080" height="1080" fill="#141416" />

  <!-- Ambient Terracotta Core Glow -->
  <circle cx="540" cy="540" r="420" fill="url(#igBgGlow)" />

  <!-- Circular Profile Perimeter Rim (Safe Guide) -->
  <circle cx="540" cy="540" r="510" fill="none" stroke="url(#igRimGrad)" stroke-width="6" />

  <!-- Authentic NextReach Vertical Emblem Mark (Centered within Circle Safe Area) -->
  <g transform="translate(305, 230) scale(3.9)" fill="none" stroke="#C76B50" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow Head -->
    <polyline points="29,38 60,8 91,38" />
    <!-- Center Stem -->
    <line x1="60" y1="8" x2="60" y2="142" />
    <!-- N: Left Stem and Diagonal -->
    <path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" />
    <!-- R: Upper Bowl -->
    <path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" />
    <!-- R: Diagonal Leg -->
    <line x1="60" y1="104" x2="110" y2="142" />
  </g>
</svg>
