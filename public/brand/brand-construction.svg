<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .c-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; fill: #FAF8F5; }
      .c-subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; fill: #8E8A84; }
      .c-mono { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #A69D92; }
      .c-mono-acc { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #C76B50; }
      .c-grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
      .c-axis { stroke: rgba(199, 107, 80, 0.4); stroke-width: 1; stroke-dasharray: 4 4; }
      .c-guide-circle { fill: none; stroke: rgba(199, 107, 80, 0.25); stroke-width: 1; stroke-dasharray: 2 2; }
      .c-node { fill: #C76B50; stroke: #FAF8F5; stroke-width: 1.5; }
    </style>
    <pattern id="gridPat" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="480" rx="16" fill="#141416" />
  <rect width="640" height="480" rx="16" fill="url(#gridPat)" />
  <rect x="1" y="1" width="638" height="478" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Header -->
  <text x="36" y="38" class="c-title">EMBLEM GEOMETRIC CONSTRUCTION SYSTEM</text>
  <text x="36" y="56" class="c-subtitle">Monogram synthesis: Upward Arrow (Ascent) + Central Pillar + Monogram ('N' &amp; 'R')</text>

  <!-- Main Blueprint Area -->
  <g transform="translate(180, 80) scale(2.0)">
    <!-- Guide Circles & Construction Arcs -->
    <!-- R-Bowl Circle Guide -->
    <circle cx="60" cy="78.5" r="25" class="c-guide-circle" />
    <circle cx="60" cy="8" r="45" class="c-guide-circle" />
    <circle cx="10" cy="40" r="14" class="c-guide-circle" />

    <!-- Center Axis Line -->
    <line x1="60" y1="-10" x2="60" y2="160" class="c-axis" />
    <line x1="-10" y1="142" x2="130" y2="142" class="c-axis" />
    <line x1="-10" y1="8" x2="130" y2="8" class="c-axis" />

    <!-- Actual Mark Strokes (Glowing Terracotta) -->
    <!-- Arrow Head -->
    <polyline points="29,38 60,8 91,38" fill="none" stroke="#C76B50" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Stem -->
    <line x1="60" y1="8" x2="60" y2="142" stroke="#C76B50" stroke-width="4.5" stroke-linecap="round" />
    <!-- N: Left Stem and Diagonal -->
    <path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" fill="none" stroke="#C76B50" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- R: Upper Bowl -->
    <path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" fill="none" stroke="#C76B50" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- R: Diagonal Leg -->
    <line x1="60" y1="104" x2="110" y2="142" stroke="#C76B50" stroke-width="4.5" stroke-linecap="round" />

    <!-- Precision Anchor Nodes -->
    <circle cx="60" cy="8" r="3" class="c-node" />
    <circle cx="29" cy="38" r="2.5" class="c-node" />
    <circle cx="91" cy="38" r="2.5" class="c-node" />
    <circle cx="10" cy="40" r="2.5" class="c-node" />
    <circle cx="10" cy="142" r="2.5" class="c-node" />
    <circle cx="60" cy="142" r="3" class="c-node" />
    <circle cx="110" cy="83" r="2.5" class="c-node" />
    <circle cx="110" cy="142" r="2.5" class="c-node" />
    <circle cx="60" cy="104" r="2.5" class="c-node" />
  </g>

  <!-- Dimension & Node Legend Annotations -->
  <g transform="translate(36, 410)">
    <rect width="568" height="48" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" />
    <text x="16" y="20" class="c-mono"><tspan fill="#C76B50" font-weight="700">ARROW APEX:</tspan> 60° Angle | <tspan fill="#C76B50" font-weight="700">R-BOWL RADIUS:</tspan> 25 unit arc | <tspan fill="#C76B50" font-weight="700">STROKE WEIGHT:</tspan> 7.5% relative</text>
    <text x="16" y="36" class="c-mono">Monogrammatic integration: Capital 'N' (Left) + Capital 'R' (Right) fused with directional arrow.</text>
  </g>
</svg>
