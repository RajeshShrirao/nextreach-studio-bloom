<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="appIconGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#C76B50" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#C76B50" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#141416" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
    <linearGradient id="appRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C76B50" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FAF8F5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#C76B50" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Charcoal Squircle Surface -->
  <rect width="512" height="512" rx="116" fill="url(#appBgGrad)" />

  <!-- Subtle Terracotta + Glass Rim -->
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#appRimGrad)" stroke-width="4" />

  <!-- Atmospheric Core Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#appIconGlow)" />

  <!-- High-Precision Center Emblem Mark -->
  <g transform="translate(146, 106) scale(1.833)" fill="none" stroke="#C76B50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow Head -->
    <polyline points="29,38 60,8 91,38" />
    <!-- Center Stem -->
    <line x1="60" y1="8" x2="60" y2="142" />
    <!-- N: Left Stem and Diagonal -->
    <path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" />
    <!-- R: Upper Bowl -->
    <path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" />
    <!-- R: Diagonal Leg -->
    <line x1="60" y1="104" x2="110" y2="142" />
  </g>
</svg>
