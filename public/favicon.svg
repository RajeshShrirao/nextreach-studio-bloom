<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C76B50" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2A2A2D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Charcoal Squircle Background -->
  <rect width="192" height="192" rx="42" fill="#2A2A2D" />
  
  <!-- Subtle Terracotta Rim Border -->
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="#C76B50" stroke-width="2" opacity="0.35" />
  
  <!-- Ambient Core Glow -->
  <circle cx="96" cy="96" r="64" fill="url(#bgGlow)" />

  <!-- Pure Emblem Mark (Centered in 192x192, scale factor 0.8) -->
  <g transform="translate(48, 36) scale(0.8)" fill="none" stroke="#C76B50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow Head -->
    <polyline points="29,38 60,8 91,38" />
    <!-- Center Stem -->
    <line x1="60" y1="8" x2="60" y2="142" />
    <!-- N: Left Stem and Diagonal -->
    <path d="M 10,142 L 10,40 Q 10,33 17,37 L 60,142" />
    <!-- R: Upper Bowl -->
    <path d="M 60,54 C 88,54 110,66 110,83 C 110,100 88,104 60,104" />
    <!-- R: Diagonal Leg -->
    <line x1="60" y1="104" x2="110" y2="142" />
  </g>
</svg>